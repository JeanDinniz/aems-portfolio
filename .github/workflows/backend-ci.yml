name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'alembic/**'
      - 'pyproject.toml'
      - 'scripts/web_docs/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/web_docs/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check app/

      - name: Run mypy
        run: mypy app/ --no-error-summary --ignore-missing-imports

  docs:
    name: Web Docs Drift
    runs-on: ubuntu-latest
    # A introspecção importa a app (app.main), que valida Settings. Sem env,
    # roda com DEBUG=False e ALLOWED_ORIGINS localhost → ValidationError.
    # DEBUG=true libera as origens de dev; não abre conexão de banco.
    env:
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aems_docs
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Regenera docs/web/*.json do código vivo + sidecar curado e valida
      # (schema + consistência + drift de endpoints/tabelas/feature flags).
      # Não precisa de banco: a introspecção lê OpenAPI/metadata em memória.
      - name: Generate web docs
        run: python scripts/web_docs/generate.py

      - name: Validate web docs
        run: python scripts/web_docs/validate.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aems_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aems_test
      REDIS_URL: redis://localhost:6379/0
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml tests/ -x -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
