version: '3.8'

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aems_db
      - REDIS_URL=redis://redis:6379/0

  celery-worker:
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aems_db
      - REDIS_URL=redis://redis:6379/0

  celery-beat:
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aems_db
      - REDIS_URL=redis://redis:6379/0
