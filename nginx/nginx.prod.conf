events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    resolver 127.0.0.11 valid=30s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Redireciona todo HTTP para HTTPS
    server {
        listen 80;
        server_name aems.example.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name aems.example.com;

        ssl_certificate     /etc/letsencrypt/live/aems.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aems.example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"       always;
        add_header X-Frame-Options           "SAMEORIGIN"    always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Gzip compression
        gzip            on;
        gzip_vary       on;
        gzip_proxied    any;
        gzip_comp_level 6;
        gzip_types      text/plain text/css application/json application/javascript
                        text/xml application/xml application/xml+rss text/javascript
                        image/svg+xml;

        client_max_body_size    20M;
        proxy_read_timeout      60s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;

        root  /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
        }

        # Service worker (vite-plugin-pwa) — nunca cachear, senão o auto-update
        # nunca dispara. Match exato tem prioridade sobre o regex de .js acima.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # Bootstrap do PWA — nomes fixos (sem hash), não podem cair no cache 1y
        location = /registerSW.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }
        location = /manifest.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        location /uploads/ {
            proxy_pass         http://minio:9000/;
            proxy_set_header   Host minio:9000;
            proxy_hide_header  x-amz-id-2;
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-server-side-encryption;
            # Fotos têm nome UUID e nunca mudam → cache imutável de 1 ano.
            # Esconde o Cache-Control do MinIO para não duplicar o header.
            proxy_hide_header  Cache-Control;
            add_header         Cache-Control "public, max-age=31536000, immutable";
            access_log         off;
        }

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            set $upstream api:8000;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_buffering          on;
            proxy_buffer_size        8k;
            proxy_buffers            8 32k;
            proxy_busy_buffers_size  64k;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            set $upstream api:8000;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location /ws/ {
            set $upstream api:8000;
            proxy_pass         http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        location /health {
            set $upstream api:8000;
            proxy_pass       http://$upstream/health;
            access_log       off;
            proxy_set_header Host $host;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

} # http
