events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Docker internal DNS — re-resolve container IPs every 30s
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ----------------------------------------------------------------
    # HTTP → HTTPS redirect (HML: hml.aems.example.com)
    # default_server: qualquer Host cai aqui e é levado ao HTTPS.
    # ----------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name hml.aems.example.com www.hml.aems.example.com;
        return 301 https://$host$request_uri;
    }

server {
    listen 443 ssl;
    server_name hml.aems.example.com www.hml.aems.example.com;

    ssl_certificate     /etc/letsencrypt/live/hml.aems.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hml.aems.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;

    # Timeouts
    client_max_body_size    60M;
    proxy_read_timeout      60s;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;

    # ----------------------------------------------------------------
    # Frontend — static files (React SPA)
    # ----------------------------------------------------------------
    root  /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # index.html nunca deve ser cacheado — garante que o browser
        # sempre baixe a versão mais recente após cada deploy
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # JS/CSS têm hash no nome (Vite content-addressing) — cache longo é seguro
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Service worker (vite-plugin-pwa) — nunca cachear, senão o auto-update
    # nunca dispara. Match exato tem prioridade sobre o regex de .js acima.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Bootstrap do PWA — nomes fixos (sem hash), não podem cair no cache 1y
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # ----------------------------------------------------------------
    # Uploads proxy — serve fotos via MinIO (S3-compatible storage)
    # S3_PUBLIC_URL=http://<host>/uploads → URLs roteadas aqui
    # ----------------------------------------------------------------
    location /uploads/ {
        # Fotos exigem autenticação (cookie aems_media ou Bearer) — o
        # subrequest abaixo valida antes de servir (ALTO-2 da auditoria)
        auth_request       /_media_auth;

        proxy_pass         http://minio:9000/;
        proxy_set_header   Host minio:9000;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  x-amz-server-side-encryption;
        # Fotos têm nome UUID e nunca mudam → cache imutável de 1 ano.
        # Esconde o Cache-Control do MinIO para não duplicar o header.
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    # Subrequest interno do auth_request acima — valida cookie/Bearer na API
    location = /_media_auth {
        internal;
        set $upstream api:8000;
        proxy_pass               http://$upstream/api/v1/upload/media-auth;
        proxy_pass_request_body  off;
        proxy_set_header         Content-Length "";
        proxy_set_header         Cookie $http_cookie;
        proxy_set_header         Authorization $http_authorization;
        access_log               off;
    }

    # ----------------------------------------------------------------
    # Backend API proxy
    # ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        set $upstream api:8000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Buffer settings for large responses (reports/files)
        proxy_buffering          on;
        proxy_buffer_size        8k;
        proxy_buffers            8 32k;
        proxy_busy_buffers_size  64k;
    }

    # Stricter rate limit on auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        set $upstream api:8000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ----------------------------------------------------------------
    # WebSocket proxy (real-time semaphore updates)
    # ----------------------------------------------------------------
    location /ws/ {
        set $upstream api:8000;
        proxy_pass         http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Keep WebSocket connections alive
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ----------------------------------------------------------------
    # Health check endpoint (used by load balancers / uptime monitors)
    # ----------------------------------------------------------------
    location /health {
        set $upstream api:8000;
        proxy_pass       http://$upstream/health;
        access_log       off;
        proxy_set_header Host $host;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

} # http
