version: '3.8'

services:
  # Nginx reverse proxy — serves static frontend and proxies API/WebSocket
  nginx:
    image: nginx:alpine
    container_name: aems_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./frontend_dist:/var/www/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI application (production — no --reload, single worker for 1GB droplet)
  api:
    image: ${DOCKER_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aems_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips '*'
    env_file: .env.production
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          # 256M era apertado demais: a API idle já ficava ~211M e estourava no
          # pico de requisições (tela de Estoque) → OOM (SIGKILL) → 502 Bad Gateway.
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Celery worker for background tasks
  celery_worker:
    image: ${DOCKER_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aems_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env.production
    # Healthcheck herdado da imagem (curl /health) so vale para a API; desabilita para nao reportar falso unhealthy
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          # 192M não comportava --concurrency=2 (2 processos × ~100M = ~200M) →
          # OOM do worker a cada poucos minutos. 320M dá folga; alternativa mais
          # enxuta seria --concurrency=1 (fica p/ um passe futuro).
          memory: 320M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery beat scheduler for periodic tasks
  celery_beat:
    image: ${DOCKER_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aems_celery_beat
    # O container roda como usuario sem escrita no workdir; beat grava o schedule em /tmp
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env.production
    # Healthcheck herdado da imagem (curl /health) so vale para a API; desabilita para nao reportar falso unhealthy
    healthcheck:
      disable: true
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: aems_postgres
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No external ports exposed — access only via internal Docker network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aems_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: aems_redis
    # noeviction: sob pressão de memória, escritas FALHAM com erro visível em vez
    # de despejar silenciosamente chaves de sessão/blacklist (allkeys-lru quebrava
    # revogação de token e sessão única sem nenhum sinal — ALTO-1 da auditoria).
    # Também é a política recomendada pelo Celery para Redis como broker.
    # maxmemory 100mb < limite de 128M do container: o processo + buffers AOF
    # vêm por cima dos dados; igualar os dois arriscava OOM-kill do container.
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    # No external ports exposed — access only via internal Docker network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Backup diário do PostgreSQL — pg_dump comprimido com retenção
  # 7 diários + 4 semanais em ./backups (bind mount: sobrevive a docker volume rm).
  # Restore: ver OPERACOES_BACKUP.md na raiz do repositório.
  db_backup:
    image: postgres:15-alpine
    container_name: aems_db_backup
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail 2>/dev/null || true
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        run_backup() {
          ts=$$(date +%F)
          dest="/backups/postgres/daily/aems_$$ts.sql.gz"
          mkdir -p /backups/postgres/daily /backups/postgres/weekly
          if [ -f "$$dest" ]; then return 0; fi
          echo "[db_backup] gerando $$dest"
          if pg_dump -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$dest.tmp" && [ -s "$$dest.tmp" ]; then
            mv "$$dest.tmp" "$$dest"
            if [ "$$(date +%u)" = "7" ]; then cp "$$dest" /backups/postgres/weekly/; fi
            ls -1t /backups/postgres/daily/*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
            ls -1t /backups/postgres/weekly/*.sql.gz 2>/dev/null | tail -n +5 | xargs -r rm -f
            echo "[db_backup] concluído: $$dest"
          else
            rm -f "$$dest.tmp"
            echo "[db_backup] ERRO: pg_dump falhou"
          fi
        }
        run_backup
        while true; do
          h=$$(date +%H | sed 's/^0//'); h=$${h:-0}
          m=$$(date +%M | sed 's/^0//'); m=$${m:-0}
          now=$$((h * 60 + m))
          if [ $$now -lt 180 ]; then wait=$$((180 - now)); else wait=$$((1440 - now + 180)); fi
          sleep $$((wait * 60))
          run_backup
        done
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Espelho diário das fotos do MinIO para ./backups/minio (incremental —
  # fotos têm nome UUID e são imutáveis, o mirror só baixa o que é novo)
  minio_backup:
    image: minio/mc
    container_name: aems_minio_backup
    env_file: .env.production
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set src http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "[minio_backup] aguardando minio..."; sleep 10
        done
        bucket="$${S3_BUCKET:-aems-files}"
        while true; do
          echo "[minio_backup] espelhando bucket $$bucket"
          mc mirror --overwrite "src/$$bucket" /backups/minio || echo "[minio_backup] ERRO no mirror"
          sleep 86400
        done
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # MinIO — S3-compatible object storage for photo uploads
  minio:
    image: minio/minio:latest
    container_name: aems_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Ports not exposed externally — API accesses via http://minio:9000
    # To create bucket on first run: temporarily expose 9001 for console access
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  minio_data:
    driver: local
