version: '3.8'

# Ambiente de Homologação (branch develop)
# Roda na mesma VPS que Produção, na porta 8080
# Diretório: /var/www/aems-hml/

services:
  nginx:
    image: nginx:alpine
    container_name: aems_hml_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend_dist:/var/www/html:ro
    depends_on:
      - api
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: ${DOCKER_IMAGE}
    container_name: aems_hml_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env.production
    volumes:
      - hml_uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    image: ${DOCKER_IMAGE}
    container_name: aems_hml_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    # Desabilita o HEALTHCHECK herdado da imagem (curl /health da API) — não se aplica ao worker.
    healthcheck:
      disable: true
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  celery_beat:
    image: ${DOCKER_IMAGE}
    container_name: aems_hml_celery_beat
    # --schedule em /tmp: o container roda como usuário sem permissão de escrita no
    # workdir, e o beat precisa gravar o arquivo de schedule (celerybeat-schedule).
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # Desabilita o HEALTHCHECK herdado da imagem (curl /health da API) — não se aplica ao beat.
    healthcheck:
      disable: true
    env_file: .env.production
    depends_on:
      - redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:15-alpine
    container_name: aems_hml_postgres
    env_file: .env.production
    volumes:
      - hml_postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aems_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    container_name: aems_hml_redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - hml_redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  minio:
    image: minio/minio:latest
    container_name: aems_hml_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - hml_minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  hml_postgres_data:
    driver: local
  hml_redis_data:
    driver: local
  hml_uploads_data:
    driver: local
  hml_minio_data:
    driver: local
