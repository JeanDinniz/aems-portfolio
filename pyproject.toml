[project]
name = "aems-backend"
version = "1.0.0"
description = "Auto Estética Management System - Backend API"
requires-python = ">=3.11"

dependencies = [
    # Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    # Teto <2.1: a 2.1.0 (set/2026) mudou a tipagem de scalars() e quebrou o mypy
    # no CI; subir de minor do ORM deve ser decisão explícita, não upgrade silencioso.
    "sqlalchemy[asyncio]>=2.0.25,<2.1",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation & Settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",

    # Cache & Queue
    "redis>=5.0.0",
    "celery>=5.3.0",

    # File Handling
    "boto3>=1.34.0",
    "pillow>=10.2.0",
    "python-magic-bin>=0.4.14;sys_platform=='win32'",
    "python-magic>=0.4.27;sys_platform!='win32'",

    # Reports
    "openpyxl>=3.1.0",
    "jinja2>=3.1.0",
    "fpdf2>=2.8.0",

    # Notifications
    "sendgrid>=6.11.0",
    "pywebpush>=2.0.0",

    # Monitoring
    "structlog>=24.1.0",

    # Rate Limiting
    "slowapi>=0.1.9",

    # QR Code
    "qrcode[pil]>=7.4.0",

    # HTTP client (Expo Push API e outros clientes externos)
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "faker>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "aiosqlite>=0.19.0",
    "jsonschema>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
no_implicit_reexport = false
disable_error_code = ["name-defined", "type-arg", "attr-defined", "untyped-decorator", "call-arg", "assignment", "arg-type", "return-value"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/integration/test_websocket.py --ignore=tests/unit/test_celery_tasks.py --ignore=tests/unit/test_semaphore.py --ignore=tests/unit/test_websocket_manager.py"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "app/db/session.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
